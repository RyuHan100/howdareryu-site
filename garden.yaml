# 정원 설정 파일.
#
# "정원" 콘셉트로 사이트를 바꿔가면서 필요한, 콘텐츠와 별개인 설정을 여기 모아둔다.
# 이 파일을 고치면 다음 `npx quartz build`(또는 dev 서버 재시작) 때 quartz.ts 가
# quartz.config.yaml 의 해당 부분을 자동으로 다시 만들어 반영한다. quartz.config.yaml
# 안에 "garden.yaml 자동 생성" 표시가 붙은 구간은 직접 고치지 말 것 — 다음 빌드에서
# 덮어써진다. 그 구간 밖(예: explorer 의 sortFn)은 여전히 손으로 고치는 영역이다.
#
# explorer: 탐색기(Explorer) 컴포넌트의 표시 이름/아이콘을 관리한다.
#   title       : 탐색기 제목.
#   folder_icon : 매핑에 없는 폴더에 기본으로 붙는 아이콘(설정에 없는 새 폴더는 이걸 쓴다).
#   folders     : 폴더의 슬러그 마지막 세그먼트(자기 자신의 이름)가 일치하면 그 아이콘을 쓴다.
#                 일치하는 게 없으면 최상위 조상 폴더 이름으로 다시 찾는다 — 즉 radar 처럼
#                 최상위 폴더에 지정하면 그 아래 폴더는 깊이와 상관없이 전부 같은 아이콘을
#                 물려받는다(예: radar/news, radar/pacm, radar/국회 기노위 전부 📡).
#                 하위 폴더에 다른 아이콘을 주려면 그 폴더 이름을 여기 따로 추가하면 된다.
#   items       : 노트(파일)가 속한 최상위 조상 폴더/파일 이름(슬러그의 첫 세그먼트)이
#                 일치하면 그 노트 제목 앞에 이 아이콘을 붙인다. radar 아래 몇 단계든
#                 들어있는 노트는 전부 이 규칙 하나로 잡힌다. 최상위 파일도 자기 자신의
#                 슬러그로 매칭된다(예: archive).
#   표시 제목에 해당 아이콘이 이미 들어있으면 중복해서 붙이지 않는다(예: 비공개
#   아카이브는 frontmatter title 에 이미 🔒 가 있어서 그대로 유지됨).
#
# 앞으로 이 파일에 추가할 것들 (아직 미구현, CLAUDE.md §8 "홈 전용 컴포넌트" 참고):
#   - plants: scribbled notes 의 글이 어떤 식물(풀/꽃/덩굴/나무)로 자랄지 판정하는 규칙
#   - radar : radar 폴더의 기록을 레이더 화면에 점으로 찍는 규칙(좌표 계산 등)
explorer:
  title: 오솔길
  folder_icon: 🪴
  folders:
    radar: 📡
  items:
    radar: 📍
    archive: 🔒
