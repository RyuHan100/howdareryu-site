# 정원 설정 파일.
#
# "정원" 콘셉트로 사이트를 바꿔가면서 필요한, 콘텐츠와 별개인 설정을 여기 모아둔다.
# 이 파일을 고치면 다음 `npx quartz build`(또는 dev 서버 재시작) 때 quartz.ts 가
# quartz.config.yaml 의 해당 부분을 자동으로 다시 만들어 반영한다. quartz.config.yaml
# 안에 "garden.yaml 자동 생성" 표시가 붙은 구간은 직접 고치지 말 것 — 다음 빌드에서
# 덮어써진다. 그 구간 밖(예: explorer 의 sortFn)은 여전히 손으로 고치는 영역이다.
#
# explorer: 탐색기(Explorer) 컴포넌트의 표시 이름/아이콘을 관리한다.
#   title       : 탐색기 제목.
#   folder_icon : 매핑에 없는 폴더에 기본으로 붙는 아이콘(설정에 없는 새 폴더는 이걸 쓴다).
#   folders     : 폴더의 슬러그 마지막 세그먼트(자기 자신의 이름)가 일치하면 그 아이콘을 쓴다.
#                 일치하는 게 없으면 최상위 조상 폴더 이름으로 다시 찾는다 — 즉 radar 처럼
#                 최상위 폴더에 지정하면 그 아래 폴더는 깊이와 상관없이 전부 같은 아이콘을
#                 물려받는다(예: radar/news, radar/pacm, radar/국회 기노위 전부 📡).
#                 하위 폴더에 다른 아이콘을 주려면 그 폴더 이름을 여기 따로 추가하면 된다.
#   items       : 노트(파일)가 속한 최상위 조상 폴더/파일 이름(슬러그의 첫 세그먼트)이
#                 일치하면 그 노트 제목 앞에 이 아이콘을 붙인다. radar 아래 몇 단계든
#                 들어있는 노트는 전부 이 규칙 하나로 잡힌다. 최상위 파일도 자기 자신의
#                 슬러그로 매칭된다(예: archive).
#   표시 제목에 해당 아이콘이 이미 들어있으면 중복해서 붙이지 않는다(예: 비공개
#   아카이브는 frontmatter title 에 이미 🔒 가 있어서 그대로 유지됨).
#
# 나머지 항목(exclude_folders, garden, plants, radar, gallery)은 홈 컴포넌트용 데이터
# 설정이다 — 아래 구분선 참고. 앞으로 정원 설정은 모두 이 파일에 추가한다.
explorer:
  title: 오솔길
  folder_icon: 🪴
  folders:
    radar: 📡
  items:
    radar: 📍
    archive: 🔒

# ─────────────────────────────────────────────────────────────────────────────
# 아래는 홈 컴포넌트(정원·radar·아빠의 화단)가 쓸 데이터 설정.
# 빌드할 때 quartz/garden/collect.ts 가 읽어 .garden-cache/garden-data.json 을 만든다.
# 항목을 지우거나 빠뜨려도 quartz/garden/config.ts 의 기본값으로 동작한다.
# 새 폴더가 생겨도 설정 없이 기본값이 적용된다(radar 새 하위 폴더는 폴더 이름 + default 색).
# ─────────────────────────────────────────────────────────────────────────────

# 홈 화면의 ②정원 ③radar ④아빠의 화단 구역을 켜고 끈다. 기본값은 모두 꺼짐(false) —
# 아직 실제로 그리는 코드가 없어서 켜도 자리 표시만 나온다. ⑤정원사에게 연락하기는 이 설정과
# 무관하게 항상 나온다. quartz.ts 가 이 값을 quartz.config.yaml 의 garden-home 플러그인
# options 에 반영한다(explorer 와 같은 마커 방식).
home:
  garden: false
  radar: false
  gallery: false

# 정원 데이터에서 뺄 폴더 이름. 경로 어디에 있든 이 이름의 폴더 안은 모두 제외
# (radar/news/data, radar/pacm/data 처럼 "모든 data 폴더").
exclude_folders:
  - img
  - data

# 정원(식물)으로 자랄 노트가 있는 폴더(content/ 기준). 그 폴더의 index.md 는 빼고 센다.
garden:
  folder: scribbled notes

# 식물 판정 — 초안. 위에서부터 차례로 보고 처음 맞는 규칙의 식물이 된다.
# 한 규칙의 any 목록 중 하나라도 맞으면 된다(한 줄 안에 조건을 여러 개 쓰면 모두 맞아야 함).
#   question: true   제목이 질문형(question_endings 중 하나로 끝남)
#   edits_min: N     git 기준 수정 횟수(처음 추가한 커밋은 빼고 센 커밋 수) N 이상
#   chars_min: N     본문 글자 수(frontmatter·마크다운 기호·줄바꿈 빼고, 공백 포함) N 이상
# 노트 frontmatter 에 plant 값이 있으면 규칙보다 우선한다. 값은 kinds 의 키(grass …)나
# 이름(풀 …) 어느 쪽이든 된다.
plants:
  frontmatter_key: plant
  kinds:
    grass: 풀
    flower: 꽃
    vine: 덩굴
    tree: 나무
  # 제목 끝의 . ! … 따옴표는 떼고 본다.
  question_endings: ["?", "？", "왜", "어떻게", "무엇", "뭘까", "일까", "을까", "는가"]
  rules:
    - plant: vine
      any:
        - question: true
    - plant: tree
      any:
        - edits_min: 30
        - chars_min: 3000
    - plant: flower
      any:
        - edits_min: 5
  default: grass
  # 마지막 수정 후 이 날수가 지나면 시든 것으로 본다.
  wither_after_days: 90

# radar 화면. 하위 폴더 이름(content/radar/ 바로 아래 폴더)별 표시 이름과 색.
# 색은 테마 CSS 변수로 쓴다(하드코딩 금지 — CLAUDE.md §9). 괄호 안 두 번째 값은 대체값.
radar:
  folder: radar
  default:
    color: var(--secondary)
  subfolders:
    news:
      label: 뉴스 클리핑
      color: var(--color-blue, var(--secondary))
    pacm:
      label: PACM
      color: var(--color-green, var(--secondary))
    국회 기노위:
      label: 국회 기노위
      color: var(--color-orange, var(--secondary))

# 아빠의 화단(갤러리). folder 는 content/ 기준.
# 같은 폴더에 meta_file 이 있으면 그림별 제목·연도·재료를 읽는다. 형식:
#   20260319_104339.jpg:        # 파일 이름(확장자 빼도 됨)
#     title: 봄 산책
#     year: 2026
#     material: 수채
gallery:
  folder: img/inspiration
  artist: 여송
  meta_file: gallery.yaml
