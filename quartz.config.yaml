# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Ryu's Garden
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ko-KR
  baseUrl: howdareryu.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf9fb"
        lightgray: "#e9e7ee"
        gray: "#a9a4b2"
        darkgray: "#6b5a85"
        dark: "#3b2260"
        secondary: "#6d28d9"
        tertiary: "#7c3aed"
        highlight: rgba(109, 40, 217, 0.08)
        textHighlight: "#7c3aed33"
      darkMode:
        light: "#121016"
        lightgray: "#1e1a24"
        gray: "#4a4553"
        darkgray: "#b8a9d4"
        dark: "#ded1f5"
        secondary: "#a78bfa"
        tertiary: "#c4b5fd"
        highlight: rgba(167, 139, 250, 0.1)
        textHighlight: "#c4b5fd33"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      # === garden.yaml 자동 생성 시작 (직접 고치지 말고 garden.yaml 을 고치세요) ===
      title: "오솔길"
      mapFn: |-
        (node) => {
          const folderIcons = {"radar":"📡"};
          const itemIcons = {"radar":"📍","archive":"🔒"};
          const plantIcons = {"scribbled-notes/2026-08-04-오빠가-냉장고를-사줬다":"🌱","scribbled-notes/2026-08-24-노동의-우울과-자율성의-훼손":"🌱","scribbled-notes/2026-09-01-토끼풀":"🌱","scribbled-notes/2026-09-20-ai":"🌼","scribbled-notes/그-목소리는-왜":"🌿"};
          const defaultFolderIcon = "🪴";
          if (node.isFolder) {
            const name = node.displayName || node.slugSegment || "";
            const top = (node.slugSegments && node.slugSegments[0]) || node.slugSegment;
            const icon = folderIcons[node.slugSegment] || folderIcons[top] || defaultFolderIcon;
            if (icon && !name.includes(icon)) node.displayName = icon + " " + name;
            return;
          }
          const top = (node.slugSegments && node.slugSegments[0]) || "";
          const itemIcon = itemIcons[top];
          if (itemIcon) {
            const name = node.displayName || node.slugSegment || "";
            if (!name.includes(itemIcon)) node.displayName = itemIcon + " " + name;
          }
          const plantIcon = plantIcons[node.data && node.data.slug];
          if (plantIcon) {
            const name = node.displayName || node.slugSegment || "";
            if (!name.includes(plantIcon)) node.displayName = plantIcon + " " + name;
          }
        }
      # === garden.yaml 자동 생성 끝 ===
      # 폴더 먼저(scribbled notes 를 맨 위에, 나머지는 이름순). 날짜가 붙은 노트끼리는 최신순.
      # 날짜는 표시 제목이 아니라 파일명에서 읽는다. scribbled notes 의 글은 frontmatter 의
      # title 로 날짜 없는 제목을 보여 주기 때문이다.
      # 날짜 없는 노트는 국회 기노위에서는 맨 위(assembly-radar 같은 안내 노트),
      # scribbled notes 에서는 맨 아래(작성일을 모르는 글)에 둔다.
      # 비교는 표시 이름이 아니라 슬러그("scribbled-notes")로 한다.
      # 플러그인이 문자열을 그대로 브라우저에 넘겨 실행하므로 JS 함수 식이어야 한다.
      # mapFn(garden.yaml 생성)이 표시 이름 앞에 이모지를 붙이므로, 마지막 비교에서는
      # 그 이모지를 떼고 원래 이름으로 비교해 정렬 순서가 흔들리지 않게 한다.
      sortFn: |-
        (a, b) => {
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
          if (a.isFolder && b.isFolder) {
            const as = a.slugSegment === "scribbled-notes", bs = b.slugSegment === "scribbled-notes";
            if (as !== bs) return as ? -1 : 1;
          }
          const dated = /^\d{4}-\d{2}-\d{2}/;
          const key = (x) => {
            if (x.isFolder) return "";
            const fp = (x.data && x.data.filePath) || "";
            const base = fp.slice(fp.lastIndexOf("/") + 1);
            return dated.test(base) ? base : "";
          };
          const ak = key(a), bk = key(b);
          if (ak && bk) return bk.localeCompare(ak, undefined, { numeric: true });
          if (!!ak !== !!bk) {
            const segs = (a.slugSegments || b.slugSegments || []);
            const undatedLast = segs[0] === "scribbled-notes";
            return (ak ? 1 : -1) * (undatedLast ? -1 : 1);
          }
          const stripIcon = (s) => s.replace(/^\p{Extended_Pictographic}️?\s*/u, "");
          const an = stripIcon(a.displayName || ""), bn = stripIcon(b.displayName || "");
          return an.localeCompare(bn, undefined, { numeric: true, sensitivity: "base" });
        }
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      # 국회/기노위/전체회의/소위원회는 거의 모든 노트에 붙어 있어 정보량이 없다.
      # 빼고 나면 남는 태그는 주제 키워드뿐이라 그래프가 주제 지도가 된다.
      localGraph:
        depth: 2 # 1이면 태그 노드까지만 보인다. 2라야 같은 주제의 다른 회의가 보인다.
        removeTags: [국회, 기노위, 전체회의, 소위원회]
        focusOnHover: true
        linkDistance: 45
        fontSize: 0.5
      globalGraph:
        depth: -1
        removeTags: [국회, 기노위]
        repelForce: 0.7
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
    options:
      displayDateType:
        - created
        - modified
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # 홈 전용 — ②정원 ③radar ④아빠의 화단(켜고 끌 수 있음, garden.yaml 의 home) +
  # ⑤정원사에게 연락하기(항상 나옴). condition: index 라 홈이 아니면 전혀 안 그려진다.
  # afterBody 안에서 hdr-comments(priority 10)보다 위(priority 5)에 오도록.
  - source: ./plugins/garden-home
    enabled: true
    options:
      # === garden.yaml 자동 생성 시작 (직접 고치지 말고 garden.yaml 을 고치세요) ===
      garden: true
      radar: false
      gallery: false
      # === garden.yaml 자동 생성 끝 ===
    layout:
      position: afterBody
      condition: index
      priority: 5
  # 댓글 (Cloudflare Workers + D1). 노트에서 끄려면 frontmatter 에 comments: false
  - source: ./plugins/hdr-comments
    enabled: true
    options:
      apiBase: https://hdr-comments.hdr-comments-worker.workers.dev
      # 댓글을 달지 않을 경로(슬러그 앞부분). 홈은 계속 바뀌는 정원/radar 요약이라
      # 댓글 스레드가 안 맞아서 뺐다(2026-09-22 사용자 결정, CLAUDE.md §9).
      exclude: [index]
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/RyuHan100/howdareryu-site
        Instagram: https://www.instagram.com/howdareryu
        Email: mailto:dare2do.everything@gmail.com
        RSS: https://howdareryu.com/index.xml
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: 최근 업데이트
      limit: 5
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 5
      condition: index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: true
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: true
    options:
      theme: hackthebox
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - hdr-comments
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - hdr-comments
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
