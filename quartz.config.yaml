# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Ryu's Garden
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-1KH1VVQ7SJ
  locale: ko-KR
  baseUrl: howdareryu.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf9fb"
        lightgray: "#e9e7ee"
        gray: "#a9a4b2"
        darkgray: "#6b5a85"
        dark: "#3b2260"
        secondary: "#6d28d9"
        tertiary: "#7c3aed"
        highlight: rgba(109, 40, 217, 0.08)
        textHighlight: "#7c3aed33"
      darkMode:
        light: "#121016"
        lightgray: "#1e1a24"
        gray: "#4a4553"
        darkgray: "#b8a9d4"
        dark: "#ded1f5"
        secondary: "#a78bfa"
        tertiary: "#c4b5fd"
        highlight: rgba(167, 139, 250, 0.1)
        textHighlight: "#c4b5fd33"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  # 다국어: 번역본은 원본 옆에 "노트.en.md" 로 둔다(파일 이름 접미사 방식).
  # languages 는 quartz/garden/collect.ts 도 읽는다(번역본을 정원 데이터에서 빼는 데).
  - source: github:boxi-os/quartz-multilanguage
    enabled: true
    options:
      languages:
        - code: ko
          label: Korean
          native: 한국어
          locale: ko-KR
        - code: en
          label: English
          native: English
          locale: en-US
      defaultLanguage: ko
      detection:
        - suffix
      linking:
        - path
      rewriteCrossLanguageLinks: true
      rootRedirect: none
      rememberChoice: true
      seo:
        hreflang: true
        ogLocale: true
      switcher:
        style: links
        label: native
        showCurrent: false
        missing: disabled
    order: 65
    layout:
      position: beforeBody
      priority: 12
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      # === garden.yaml 자동 생성 시작 (직접 고치지 말고 garden.yaml 을 고치세요) ===
      title: "오솔길"
      mapFn: |-
        (node) => {
          const folderIcons = {"radar":"📡"};
          const itemIcons = {"radar":"📍","archive":"🔒","timeline":"🕰️","glossary":"📖","gallery":"🌼"};
          const plantIcons = {"scribbled-notes/2026-08-04-오빠가-냉장고를-사줬다":"🌱","scribbled-notes/2026-08-24-노동의-우울과-자율성의-훼손":"🌱","scribbled-notes/2026-09-20-ai":"🌼"};
          const defaultFolderIcon = "🪴";
          if (node.isFolder) {
            const name = node.displayName || node.slugSegment || "";
            const top = (node.slugSegments && node.slugSegments[0]) || node.slugSegment;
            const icon = folderIcons[node.slugSegment] || folderIcons[top] || defaultFolderIcon;
            if (icon && !name.includes(icon)) node.displayName = icon + " " + name;
            return;
          }
          const top = (node.slugSegments && node.slugSegments[0]) || "";
          const itemIcon = itemIcons[top];
          if (itemIcon) {
            const name = node.displayName || node.slugSegment || "";
            if (!name.includes(itemIcon)) node.displayName = itemIcon + " " + name;
          }
          const plantIcon = plantIcons[node.data && node.data.slug];
          if (plantIcon) {
            const name = node.displayName || node.slugSegment || "";
            if (!name.includes(plantIcon)) node.displayName = plantIcon + " " + name;
          }
        }
      # === garden.yaml 자동 생성 끝 ===
      # 오솔길에는 한국어 원본만 보인다. 영문본(노트.en.md, quartz-multilanguage)은 제목 아래
      # 언어 스위처로만 오간다. "tags" 제외는 explorer 플러그인의 기본 필터를 그대로 옮긴 것.
      filterFn: |-
        (node) => node.slugSegment !== "tags" && !/\.en$/.test(node.slugSegment)
      # 최상단 순서는 사용자가 지정한 고정 목록(TOP_ORDER, 2026-09-23, 2026-09-26 에 climate
      # glossary 추가)을 먼저 따른다 — scribbled notes → radar → climate histography →
      # climate glossary → 아빠의 화단 → basement → 터미널 명령어 노트. 목록에 없는 항목
      # (archive 등)은 그 뒤에 기존 규칙대로 붙는다.
      # rank() 는 노드 "자기 자신"의 슬러그 세그먼트(slugSegment)만 보므로 폴더 안(예: radar
      # 아래 news/pacm/국회 기노위)끼리 비교할 때는 전부 미지정(순위 없음) 취급되어 이 규칙과
      # 무관하게 원래 로직(폴더 먼저, scribbled notes 를 맨 위에, 나머지는 이름순 — 날짜가
      # 붙은 노트끼리는 최신순)이 그대로 적용된다.
      # 날짜는 표시 제목이 아니라 파일명에서 읽는다. scribbled notes 의 글은 frontmatter 의
      # title 로 날짜 없는 제목을 보여 주기 때문이다.
      # 날짜 없는 노트는 국회 기노위에서는 맨 위(assembly-radar 같은 안내 노트),
      # scribbled notes 에서는 맨 아래(작성일을 모르는 글)에 둔다.
      # 비교는 표시 이름이 아니라 슬러그("scribbled-notes")로 한다.
      # 플러그인이 문자열을 그대로 브라우저에 넘겨 실행하므로 JS 함수 식이어야 한다.
      # mapFn(garden.yaml 생성)이 표시 이름 앞에 이모지를 붙이므로, 마지막 비교에서는
      # 그 이모지를 떼고 원래 이름으로 비교해 정렬 순서가 흔들리지 않게 한다.
      sortFn: |-
        (a, b) => {
          const TOP_ORDER = ["scribbled-notes", "radar", "timeline", "glossary", "gallery", "basement.base", "basic-terminal-command-for-quartz"];
          const rank = (x) => {
            const i = TOP_ORDER.indexOf(x.slugSegment || "");
            return i === -1 ? TOP_ORDER.length : i;
          };
          const ra = rank(a), rb = rank(b);
          if (ra !== rb) return ra - rb;
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
          if (a.isFolder && b.isFolder) {
            const as = a.slugSegment === "scribbled-notes", bs = b.slugSegment === "scribbled-notes";
            if (as !== bs) return as ? -1 : 1;
          }
          const dated = /^\d{4}-\d{2}-\d{2}/;
          const key = (x) => {
            if (x.isFolder) return "";
            const fp = (x.data && x.data.filePath) || "";
            const base = fp.slice(fp.lastIndexOf("/") + 1);
            return dated.test(base) ? base : "";
          };
          const ak = key(a), bk = key(b);
          if (ak && bk) return bk.localeCompare(ak, undefined, { numeric: true });
          if (!!ak !== !!bk) {
            const segs = (a.slugSegments || b.slugSegments || []);
            const undatedLast = segs[0] === "scribbled-notes";
            return (ak ? 1 : -1) * (undatedLast ? -1 : 1);
          }
          const stripIcon = (s) => s.replace(/^\p{Extended_Pictographic}️?\s*/u, "");
          const an = stripIcon(a.displayName || ""), bn = stripIcon(b.displayName || "");
          return an.localeCompare(bn, undefined, { numeric: true, sensitivity: "base" });
        }
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      # 국회/기노위/전체회의/소위원회는 거의 모든 노트에 붙어 있어 정보량이 없다.
      # 빼고 나면 남는 태그는 주제 키워드뿐이라 그래프가 주제 지도가 된다.
      localGraph:
        depth: 2 # 1이면 태그 노드까지만 보인다. 2라야 같은 주제의 다른 회의가 보인다.
        removeTags: [국회, 기노위, 전체회의, 소위원회]
        focusOnHover: true
        linkDistance: 45
        fontSize: 0.5
      globalGraph:
        depth: -1
        removeTags: [국회, 기노위]
        repelForce: 0.7
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
    options:
      displayDateType:
        - created
        - modified
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # 읽기 진행률 바 — 화면 맨 위 얇은 바, <article> 기준 스크롤 진행률. 홈은 긴 글을 "읽는"
  # 페이지가 아니라서 condition: not-index 로 뺀다(climate histography 처럼 세로 스크롤이
  # 아닌 시각화 페이지는 존재만 감지해 스크립트에서 숨김 — quartz.config.yaml 에서는 손댈
  # 필요 없음, plugins/reading-progress/src 주석 참고).
  - source: ./plugins/reading-progress
    enabled: true
    layout:
      position: beforeBody
      priority: 0
      condition: not-index
  # 집중 모드(Focus Mode) 토글 — 좌우 sidebar 숨기고 본문만 넓게. beforeBody 에 두는 이유는
  # plugins/focus-mode/src/component.js 주석 참고(sidebar 안에 두면 토글이 자기 자신을
  # 숨겨버려서 다시 못 끈다).
  - source: ./plugins/focus-mode
    enabled: true
    layout:
      position: beforeBody
      priority: 1
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # 홈 전용 — ②정원 ③radar ④아빠의 화단(켜고 끌 수 있음, garden.yaml 의 home) +
  # ⑤정원사에게 연락하기(항상 나옴). condition: index 라 홈이 아니면 전혀 안 그려진다.
  # afterBody 안에서 hdr-comments(priority 10)보다 위(priority 5)에 오도록.
  - source: ./plugins/garden-home
    enabled: true
    options:
      # === garden.yaml 자동 생성 시작 (직접 고치지 말고 garden.yaml 을 고치세요) ===
      garden: true
      radar: true
      gallery: true
      # === garden.yaml 자동 생성 끝 ===
    layout:
      position: afterBody
      condition: index
      priority: 5
  # 아빠의 화단 전체 그림 페이지(격자 + 라이트박스) — content/gallery.md 에서만 나온다
  - source: ./plugins/gallery-page
    enabled: true
    layout:
      position: afterBody
      condition: gallery
      priority: 5
  # climate histography — 기후 사건 연표(월 단위 가로 타임라인). content/timeline.md 에서만 나온다
  - source: ./plugins/climate-timeline
    enabled: true
    layout:
      position: afterBody
      condition: timeline
      priority: 5
  # climate glossary — 기후 용어집(검색·카테고리 필터). content/glossary.md 에서만 나온다
  - source: ./plugins/climate-glossary
    enabled: true
    layout:
      position: afterBody
      condition: glossary
      priority: 5
  # 댓글 (Cloudflare Workers + D1). 노트에서 끄려면 frontmatter 에 comments: false
  - source: ./plugins/hdr-comments
    enabled: true
    options:
      apiBase: https://hdr-comments.hdr-comments-worker.workers.dev
      # 댓글을 달지 않을 경로(슬러그 앞부분). 홈은 계속 바뀌는 정원/radar 요약이라
      # 댓글 스레드가 안 맞아서 뺐다(2026-09-22 사용자 결정, CLAUDE.md §9).
      exclude: [index]
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/RyuHan100/howdareryu-site
        Instagram: https://www.instagram.com/howdareryu
        Email: mailto:dare2do.everything@gmail.com
        RSS: https://howdareryu.com/index.xml
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: 최근 업데이트
      limit: 5
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 5
      condition: index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: true
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties:
        - translate
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: true
    options:
      theme: hackthebox
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - hdr-comments
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - hdr-comments
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
